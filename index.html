<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>글로벌 쇼츠 트렌드</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --bg: #0b0d12;
    --card-bg: #141821;
    --card-border: #232838;
    --text: #eef1f7;
    --text-dim: #9aa3b8;
    --accent: #7c9dff;
    --film: #ff9d6c;
    --show: #7ce0c3;
    --viral: #ff7ca8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
  }
  header {
    padding: 32px 24px 8px;
    max-width: 1200px;
    margin: 0 auto;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 28px;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 8px 24px 48px;
  }
  .tabbar {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .tab {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab.active {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
  }
  .tab.sub {
    font-size: 13px;
    padding: 6px 14px;
  }
  .datebar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .datebar button {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .datebar button:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .datebar .date-label {
    font-weight: 700;
    color: var(--text);
    font-size: 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .card {
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
  }
  .thumb-wrap {
    position: relative;
    aspect-ratio: 9 / 16;
    background: #000;
    max-height: 320px;
  }
  .thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .rank {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(0,0,0,0.72);
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 6px;
  }
  .duration {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(0,0,0,0.72);
    color: #fff;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .card-body {
    padding: 12px;
  }
  .title {
    font-size: 14px;
    line-height: 1.4;
    margin: 0 0 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .channel {
    font-size: 12px;
    color: var(--text-dim);
    margin: 0 0 10px;
  }
  .stat-row {
    display: flex;
    gap: 10px;
    font-size: 12px;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .score {
    margin-left: auto;
    color: var(--accent);
    font-weight: 600;
  }
  .empty, .loading {
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 24px;
  }
  footer {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 40px;
    color: var(--text-dim);
    font-size: 12px;
  }
</style>
</head>
<body>
  <header>
    <h1>🌏 글로벌 쇼츠 트렌드</h1>
    <p>매일 자동 갱신 · 1분 이하 실제 세로형(9:16) 쇼츠만 · 조회수+좋아요 합산 점수 기준 TOP 10</p>
  </header>
  <main>
    <div class="tabbar" id="categoryTabs"></div>
    <div class="tabbar" id="groupTabs"></div>
    <div class="datebar" id="dateBar"></div>
    <div id="content"></div>
  </main>
  <footer>
    개인용으로 생성된 페이지입니다. 데이터 출처: YouTube Data API (mostPopular) + shorts 판별 검증.
  </footer>

<script>
(function () {
  var state = {
    categories: [],
    groups: [],
    dates: [],
    dateIndex: -1,      // state.dates 안에서 현재 보고 있는 날짜 인덱스
    category: null,
    group: null,
    cache: {}           // date -> day json
  };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function formatCount(n) {
    n = Number(n) || 0;
    if (n >= 100000000) return (n / 100000000).toFixed(1) + '억';
    if (n >= 10000) return (n / 10000).toFixed(1) + '만';
    return n.toLocaleString();
  }

  function renderTabs() {
    var catBar = document.getElementById('categoryTabs');
    catBar.innerHTML = '';
    state.categories.forEach(function (cat) {
      var b = el('button', 'tab' + (cat.key === state.category ? ' active' : ''), cat.label);
      b.onclick = function () { state.category = cat.key; renderTabs(); renderContent(); };
      catBar.appendChild(b);
    });

    var groupBar = document.getElementById('groupTabs');
    groupBar.innerHTML = '';
    state.groups.forEach(function (g) {
      var b = el('button', 'tab sub' + (g.key === state.group ? ' active' : ''), g.label);
      b.onclick = function () { state.group = g.key; renderTabs(); renderContent(); };
      groupBar.appendChild(b);
    });

    renderDateBar();
  }

  function renderDateBar() {
    var bar = document.getElementById('dateBar');
    bar.innerHTML = '';
    if (!state.dates.length) return;

    var prevBtn = el('button', null, '◀ 이전 날짜');
    prevBtn.disabled = state.dateIndex <= 0;
    prevBtn.onclick = function () {
      if (state.dateIndex > 0) { state.dateIndex -= 1; renderDateBar(); renderContent(); }
    };

    var nextBtn = el('button', null, '다음 날짜 ▶');
    nextBtn.disabled = state.dateIndex >= state.dates.length - 1;
    nextBtn.onclick = function () {
      if (state.dateIndex < state.dates.length - 1) { state.dateIndex += 1; renderDateBar(); renderContent(); }
    };

    var label = el('span', 'date-label', state.dates[state.dateIndex] +
      (state.dateIndex === state.dates.length - 1 ? ' (최신)' : ''));

    bar.appendChild(prevBtn);
    bar.appendChild(label);
    bar.appendChild(nextBtn);
  }

  function videoCard(v, rank) {
    var a = el('a', 'card');
    a.href = 'https://www.youtube.com/shorts/' + v.video_id;
    a.target = '_blank';
    a.rel = 'noopener';

    var thumbWrap = el('div', 'thumb-wrap');
    var img = el('img', 'thumb');
    img.src = v.thumbnail;
    img.loading = 'lazy';
    img.alt = '';
    var rankEl = el('span', 'rank', '#' + rank);
    var mm = Math.floor(v.duration_sec / 60);
    var ss = v.duration_sec % 60;
    var durEl = el('span', 'duration', mm + ':' + (ss < 10 ? '0' : '') + ss);
    thumbWrap.appendChild(img);
    thumbWrap.appendChild(rankEl);
    thumbWrap.appendChild(durEl);

    var body = el('div', 'card-body');
    var title = el('h3', 'title', v.title);
    var channel = el('p', 'channel', v.channel);
    var statRow = el('div', 'stat-row');
    statRow.appendChild(el('span', null, '👁 ' + formatCount(v.view_count)));
    statRow.appendChild(el('span', null, '👍 ' + formatCount(v.like_count)));
    statRow.appendChild(el('span', 'score', '점수 ' + v.score.toFixed(2)));
    body.appendChild(title);
    body.appendChild(channel);
    body.appendChild(statRow);

    a.appendChild(thumbWrap);
    a.appendChild(body);
    return a;
  }

  function renderContent() {
    var content = document.getElementById('content');
    content.innerHTML = '';
    if (state.dateIndex < 0) {
      content.appendChild(el('p', 'empty', '아직 수집된 데이터가 없어요. 내일 첫 자동 실행 후 다시 확인해주세요.'));
      return;
    }
    var date = state.dates[state.dateIndex];

    function draw(dayData) {
      content.innerHTML = '';
      var videos = ((dayData.categories || {})[state.category] || {})[state.group] || [];
      if (!videos.length) {
        content.appendChild(el('p', 'empty', '이 조합(카테고리/국가/날짜)에는 조건에 맞는 쇼츠가 없었어요.'));
        return;
      }
      var grid = el('div', 'grid');
      videos.forEach(function (v, i) { grid.appendChild(videoCard(v, i + 1)); });
      content.appendChild(grid);
    }

    if (state.cache[date]) {
      draw(state.cache[date]);
      return;
    }
    content.appendChild(el('p', 'loading', '불러오는 중...'));
    fetch('data/days/' + date + '.json', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (dayData) {
        state.cache[date] = dayData;
        draw(dayData);
      })
      .catch(function () {
        content.innerHTML = '';
        content.appendChild(el('p', 'empty', '데이터를 불러오지 못했어요.'));
      });
  }

  fetch('data/index.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (idx) {
      state.categories = idx.categories || [];
      state.groups = idx.groups || [];
      state.dates = idx.dates || [];
      state.dateIndex = state.dates.length - 1;
      state.category = (state.categories[0] || {}).key || null;
      state.group = (state.groups[0] || {}).key || null;
      renderTabs();
      renderContent();
    })
    .catch(function () {
      document.getElementById('content').appendChild(
        el('p', 'empty', '아직 수집된 데이터가 없어요. 첫 자동 실행 후 다시 확인해주세요.')
      );
    });
})();
</script>
</body>
</html>
